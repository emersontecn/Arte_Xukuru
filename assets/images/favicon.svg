<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="terracottaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C45A35" />
      <stop offset="100%" stop-color="#D99B26" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14281C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo Circular com Sombra -->
  <circle cx="32" cy="32" r="30" fill="url(#terracottaGold)" filter="url(#shadow)"/>
  <circle cx="32" cy="32" r="30" fill="url(#innerGlow)"/>

  <!-- Borda Étnica Pontilhada / Pespontos Tradicionais -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.8" stroke-dasharray="3.5 2.5"/>

  <!-- Detalhe da Coroa Geográfica Sagrada (Cruz/Pontos Cardeais) -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Estrela / Sol Sagrado Central Xukuru -->
    <path d="M32 11 L35.8 22.8 H48.2 L38.2 30.1 L42 41.9 L32 34.6 L22 41.9 L25.8 30.1 L15.8 22.8 H28.2 Z" 
          stroke="#1F3E2B" stroke-width="0.8" stroke-linejoin="round"/>
    
    <!-- Centro Geométrico Sagrado -->
    <circle cx="32" cy="28.5" r="3.2" fill="#1F3E2B"/>
    <circle cx="32" cy="28.5" r="1.5" fill="#FCF4E5"/>

    <!-- Pequenos losangos nos pontos cardeais -->
    <polygon points="32,6 33.5,8 32,10 30.5,8" fill="#FFFFFF"/>
    <polygon points="32,48 33.5,50 32,52 30.5,50" fill="#FFFFFF"/>
    <polygon points="8,32 10,33.5 12,32 10,30.5" fill="#FFFFFF"/>
    <polygon points="52,32 54,33.5 56,32 54,30.5" fill="#FFFFFF"/>
  </g>
</svg>
